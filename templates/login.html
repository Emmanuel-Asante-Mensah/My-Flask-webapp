<!DOCTYPE html>
<html>
<head>
    <title>Form Example</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styling.css') }}">
</head>

<script>
  function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    if (field.type === "password") {
      field.type = "text";
    } else {
      field.type = "password";
    }
  }
</script>

<body class="login">
    <div class="signup-container">
    <h1>LOGIN</h1>
    <form method="POST" action="/login">
        <input type="email" name="email" placeholder="E-mail" required><br><br>
        <div class="password-container">
        <input type="password" id="password" name="password" placeholder="Password" required>
        <span class="toggle-eye" onclick="togglePassword('password')">👁️</span>
        </div>
        <br><br>
        <a href="/"> No account? Create new account </a><br><br>
        <a href="/forgot_password">Forgot your password?</a><br><br>

        <button type="submit">Login</button>
    </form>
    </div>

    {% if error and message_type == "error" %}
        <div class="error">{{error}}</div>
    {%endif%}

    {% if error and message_type == "success" %}
        <div class="success">{{ error }}</div>
    {% endif %}

</body>
</html>
