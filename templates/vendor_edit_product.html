<!DOCTYPE html>
<html>
<head>
    <title>Add Service</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styling.css') }}">
</head>
<body class="goods">
    <div class="vendor-navbar">
        <a href="{{ url_for('vendor_homepage') }}">🏠 Home</a>
        <a href="{{ url_for('vendor_bookings') }}">📑 Bookings</a>
        <a href="{{ url_for('vendor_add_product') }}">➕ Add Product</a>
        <a href="{{ url_for('vendor_add_service') }}">➕ Add Service</a>
        <a href="{{ url_for('logout') }}">🚪 Logout</a>
    </div>

     <div class="content"> 
        <form method="POST">
            <input type="text" name="title" value="{{ product.title }}" required><br><br>
            <textarea name="description" required>{{ product.description }}</textarea><br><br>
            <input type="number" step="0.01" name="price" value="{{ product.price }}" required><br><br>
            <button type="submit">Update Product</button>
        </form>
    </div>
</body>
</html>
